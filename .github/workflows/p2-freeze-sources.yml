name: P2 one-time freeze official source bytes
on:
  push:
    branches: [feat/p2-england-country-pack]
    paths:
      - .github/workflows/p2-freeze-sources.yml

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and hash three allowlisted official publication pages once
        run: python3 tools/p2/freeze_sources.py
      - name: Commit only frozen inputs and their byte manifest
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/england-school-pilot-v1/raw/ data/england-school-pilot-v1/raw-source-manifest.json
          git commit -m "P2: freeze official release source bytes (OGL attributed)"
          git push origin HEAD:refs/heads/feat/p2-england-country-pack
