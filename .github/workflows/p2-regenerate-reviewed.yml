name: P2 reviewed fixture regeneration (anchored headline fix)
on:
  push:
    branches: [feat/p2-england-country-pack]
    paths:
      - .github/workflows/p2-regenerate-reviewed.yml
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Regenerate offline evidence and test its negative controls
        run: |
          python3 tools/p2/build_pack.py --write
          python3 -m unittest discover -s tools/p2 -p 'test_*.py' -v
          python3 tools/p2/build_pack.py --check
      - name: Commit generated provenance and lock manifests
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/england-school-pilot-v1/{country-pack,manifest,news-bundle,narrative-diff}.json
          if ! git diff --cached --quiet; then
            git commit -m "P2: regenerate source-checked reviewed provenance"
            git push origin HEAD:refs/heads/feat/p2-england-country-pack
          fi
