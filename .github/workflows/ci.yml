name: Essential offline checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: essential-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  offline-rust:
    name: Offline Rust foundation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files before installing dependencies
        shell: bash
        run: bash .github/scripts/scan-secrets.sh tracked
      - name: Detect Rust workspace
        id: workspace
        shell: bash
        run: |
          if [ -f Cargo.toml ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'No Rust workspace on this branch; skip Rust checks'
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.workspace.outputs.present == 'true'
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - name: Verify pinned toolchain and locked Cargo dependencies
        if: steps.workspace.outputs.present == 'true'
        shell: bash
        run: |
          pinned=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          active=$(rustc --version | awk '{print $2}')
          if [ -z "$pinned" ] || [ "$pinned" != "$active" ]; then
            echo "Rust toolchain mismatch: file=$pinned active=$active" >&2
            exit 1
          fi
          # A fresh runner has no registry index; fetch locked dependencies first.
          cargo fetch --locked
      - name: Format
        if: steps.workspace.outputs.present == 'true'
        run: cargo fmt --all -- --check
      - name: Pure rules source guard (fail closed)
        if: steps.workspace.outputs.present == 'true'
        shell: bash
        run: |
          if [ ! -d crates/domain/src ]; then
            echo 'Domain source directory missing' >&2
            exit 1
          fi
          mapfile -d '' -t sources < <(find crates -type f -name '*.rs' -print0)
          if [ "${#sources[@]}" -eq 0 ]; then
            echo 'No Rust source files found' >&2
            exit 1
          fi
          re='HashMap|HashSet|([.]|::)(exp|exp2|ln|log|log2|log10|powf|sin|cos|tan|asin|acos|atan|atan2|sinh|cosh|tanh|hypot|cbrt)[[:space:]]*[(]'
          for src in "${sources[@]}"; do
            rc=0
            grep -nE "$re" "$src" || rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "Forbidden nondeterministic primitive in $src" >&2
              exit 1
            fi
            if [ "$rc" -ne 1 ]; then
              echo "Source scan error ($rc): $src" >&2
              exit 1
            fi
          done
      - name: Clippy
        if: steps.workspace.outputs.present == 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        if: steps.workspace.outputs.present == 'true'
        run: cargo test --workspace --locked
      - name: Verify generated Serde / TS / JSON Schema contract drift
        if: steps.workspace.outputs.present == 'true'
        run: cargo run --locked -p myth-contracts --bin export-contracts -- --check
      - name: Detect React workspace
        id: web
        shell: bash
        run: |
          if [ -f apps/web/package.json ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          elif [ -d apps/web ]; then
            echo 'apps/web exists but package.json is missing' >&2
            exit 1
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.web.outputs.present == 'true'
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install pinned frontend dependencies
        if: steps.web.outputs.present == 'true'
        run: npm --prefix apps/web ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck and build interface
        if: steps.web.outputs.present == 'true'
        run: npm --prefix apps/web run build
      - name: Scan compiled frontend assets (fail closed)
        if: steps.web.outputs.present == 'true'
        shell: bash
        run: bash .github/scripts/scan-secrets.sh dist apps/web/dist
