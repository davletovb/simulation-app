name: Essential offline checks

on:
  pull_request:
    paths: &rust_paths
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - 'crates/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths: *rust_paths

concurrency:
  group: essential-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  offline-rust:
    name: Offline Rust foundation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Core deterministic-source guard
        shell: bash
        run: |
          if grep -R -n -E 'HashMap|HashSet|\.exp\(|\.ln\(|\.powf\(' crates/domain/src --include='*.rs'; then
            echo "Nondeterministic collection or platform transcendental in domain source" >&2
            exit 1
          fi
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Coarse offline credential pattern scan
        shell: bash
        run: |
          if grep -R -n -E 'sk-or-v1-[A-Za-z0-9]{16,}|OPENROUTER_API_KEY=[^[:space:]]+' crates --include='*.rs' --include='*.toml' --include='*.json'; then
            echo "Credential-like literal detected" >&2
            exit 1
          fi
          # Excludes this workflow's own detector pattern. Full tracked-tree and
          # compiled-asset scanning will be added at the P1-05 gate.
