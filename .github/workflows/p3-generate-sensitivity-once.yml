name: P3 one-shot reproducible Experiment B report
on:
  push:
    branches: [feat/p3-pure-reducer]
    paths: [.github/workflows/p3-generate-sensitivity-once.yml]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: dtolnay/rust-toolchain@stable
        with: {components: rustfmt}
      - name: Format, test, and execute declared offline sensitivity sweep
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo test -p myth-domain --locked
          cargo run --quiet --locked -p myth-domain --example p3_report
      - name: Commit frozen output plus formatted sources
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/domain/src crates/domain/examples/p3_report.rs docs/p3-sensitivity-report.md data/england-school-pilot-v1/p3-sensitivity-results.csv
          if ! git diff --cached --quiet; then
            git commit -m "P3: execute and freeze 144-variant fixed-action sensitivity results"
            git push origin HEAD:refs/heads/feat/p3-pure-reducer
          fi
