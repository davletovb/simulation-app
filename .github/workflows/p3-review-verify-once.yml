name: P3 review amendments one-shot verification
on:
  push:
    branches: [feat/p3-pure-reducer]
    paths: [.github/workflows/p3-review-verify-once.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: dtolnay/rust-toolchain@stable
        with: {components: rustfmt, clippy}
      - name: Format, strict lints, tests and regenerate corrected evidence
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          cargo run --quiet --locked -p myth-domain --example p3_report
      - name: Commit canonical source and updated sensitivity evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/domain/src crates/domain/examples/p3_report.rs docs/p3-sensitivity-report.md data/england-school-pilot-v1/p3-sensitivity-results.csv
          if ! git diff --cached --quiet; then
            git commit -m "P3 review: verify audited commitments and corrected sensitivity attribution"
            git push origin HEAD:refs/heads/feat/p3-pure-reducer
          fi
