name: P2 one-time offline generated artifacts
on:
  push:
    branches: [feat/p2-england-country-pack]
    paths:
      - .github/workflows/p2-generate-once.yml

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Rebuild from archived official source bytes without network
        run: python3 tools/p2/build_pack.py --write
      - name: Commit rebuilt hash-verified country pack and manifest
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/england-school-pilot-v1/country-pack.json data/england-school-pilot-v1/manifest.json
          git commit -m "P2: produce versioned source-byte-verified country pack"
          git push origin HEAD:refs/heads/feat/p2-england-country-pack
