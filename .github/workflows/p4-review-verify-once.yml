name: P4 review amendments one-time Rust verification
on:
  push:
    branches: [feat/p4-hiyal-recovery]
    paths: [.github/workflows/p4-review-verify-once.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p4-hiyal-recovery
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          components: rustfmt,clippy
      - name: Canonical format and commit source
        run: |
          set -euo pipefail
          cargo fmt --all
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/hiyal-adapter
          if ! git diff --cached --quiet; then
            git commit -m 'P4 review: canonical Rust formatting for recovery and replay fixes'
            git push origin HEAD:refs/heads/feat/p4-hiyal-recovery
          fi
      - name: Validate strict adapter tests and all workspace tests
        run: |
          set -euo pipefail
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
