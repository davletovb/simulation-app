[package]
name = "myth-local-api"
default-run = "myth-local-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Offline loopback Axum adapter for scripted Myth Maker previews and local recordings"

[lints]
workspace = true

[dependencies]
myth-domain = { path = "../domain" }
myth-contracts = { path = "../contracts" }
axum = "=0.8.6"
tokio = { version = "=1.47.1", features = ["macros", "rt-multi-thread", "net"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
